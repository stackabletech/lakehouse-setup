####################################################################################
# External access to the two local stand-ins. Local only.
#
# ── Ports ────────────────────────────────────────────────────────────────────────
#   31090  MinIO console   https
#   31091  Forgejo         https
#
# The MinIO console is useful for looking at what the load path actually wrote:
# the Iceberg warehouse under `lakehouse/warehouse/`, the Airflow task logs under
# `lakehouse/airflow-logs/`, and the source file under `raw/customers/`.
# Log in as `admin` / `adminadmin` (testing/00-minio.yaml), or as one of the two
# scoped users to see what they are actually allowed to do.
#
# Forgejo is useful for seeing the DAGs Airflow is syncing, as a repository
# rather than as files in a pod. Log in as `lakehouse` /
# `lakehouse-git-password` (testing/02-forgejo.yaml); the repository is private,
# so an anonymous browser sees nothing.
#
# Both serve certificates from the platform's internal CA, which browsers do not
# know. The warning is expected.
####################################################################################
---
apiVersion: v1
kind: Service
metadata:
  name: minio-external
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - {name: http-console, port: 9001, targetPort: 9001, nodePort: 31090}
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo-external
spec:
  type: NodePort
  selector:
    app: forgejo
  ports:
    - {name: https, port: 3000, targetPort: 3000, nodePort: 31091}

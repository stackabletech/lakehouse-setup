####################################################################################
# Template for a secured Spark job writing Iceberg tables into the lakehouse.
#
# Copy this file, replace the job script and the resource sizing, and keep the
# `sparkConf` block as it is - that block is what satisfies the security
# requirements and what makes Spark and Trino agree about where the data is.
#
# The security settings:
#   spark.authenticate            mutual authentication between driver and
#                                 executors. The operator generates the shared
#                                 secret and delivers it to both.
#   spark.network.crypto.enabled  AES-GCM encryption of the RPC channel and of
#                                 block transfers between executors. Keys are
#                                 derived from the auth secret.
#   spark.io.encryption.enabled   encryption of shuffle spill and other
#                                 temporary data written to local disk.
#   spark.ssl.ui.*                TLS for the Spark web UI, pinned to TLS 1.3,
#                                 using a certificate issued by the platform.
#
# ── FILL IN ──────────────────────────────────────────────────────────────────────
#   CHANGEME-NAMESPACE   the namespace this is deployed into. Unlike the files
#                        under manifests/, this one is applied by hand, so
#                        substitute it yourself:
#                          sed 's/CHANGEME-NAMESPACE/lakehouse/g' \
#                            examples/spark-iceberg-job.yaml | kubectl apply -n lakehouse -f -
#
# IMPORTANT - `deps.packages` downloads the Iceberg libraries from Maven Central
#   at job start. On a cluster without outbound access to Maven Central, point
#   Spark at an internal mirror or bake the two JARs into a custom Spark image
#   and remove the `deps` block. Do not leave a production load path depending
#   on internet access.
#
# IMPORTANT - two different S3 clients are configured below, deliberately:
#     spark.hadoop.fs.s3a.*   Hadoop S3A, used to READ the source CSV. Only S3A
#                             can read arbitrary files off the object store.
#     spark.sql.catalog.*.s3  Iceberg's own S3FileIO, used to WRITE the table.
#                             It speaks `s3://` natively, which is what Trino
#                             also uses, so both address the same data with the
#                             same URIs.
#   Neither one covers both jobs. Removing either breaks half the script.
#
# IMPORTANT - `s3connection.reference` lets the operator mount the object
#   store's CA into driver and executors. Do not set `-Djavax.net.ssl.trustStore`
#   by hand instead: that replaces the JVM's system truststore, and dependency
#   resolution over TLS then fails.
#
# IMPORTANT - a Spark application whose driver failed to start its encrypted
#   channel can still report `phase: Succeeded` with zero executors. Do not gate
#   a pipeline on the phase alone; check that executors registered, or have the
#   job write a completion marker and check for that.
#
# NOTE - both S3 clients verify the object store's certificate against the CA
#   the operator mounts from `s3connection.reference`. Endpoints are fully
#   qualified Service names because that is the only name in that certificate;
#   the reasoning is in manifests/02-s3.yaml.
#
# NOTE - the credentials arrive as AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
#   environment variables, which both S3 clients pick up from their default
#   credential chain. That keeps them out of this file and out of `sparkConf`,
#   which is visible in the Spark UI.
#
# NOTE - the script this job runs lives in the ConfigMap `spark-jobs`, defined
#   in manifests/40-spark-jobs.yaml. Apply that first, or point
#   `mainApplicationFile` and the `job` volume at your own script.
#
# Run it with:
#   kubectl apply -n <namespace> -f examples/spark-iceberg-job.yaml
#   kubectl get sparkapplications -n <namespace> -w
####################################################################################
---
apiVersion: spark.stackable.tech/v1alpha1
kind: SparkApplication
metadata:
  name: customer-ingest
spec:
  sparkImage:
    # Iceberg 1.11.0 requires Spark 4.1.x.
    productVersion: 4.1.2
  mode: cluster
  mainApplicationFile: local:///stackable/spark/jobs/spark_ingest.py
  # Read-write identity. The operator also mounts this connection's CA into
  # driver and executors.
  s3connection:
    reference: lakehouse-rw
  deps:
    packages:
      - org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:1.11.0
      - org.apache.iceberg:iceberg-aws-bundle:1.11.0
  sparkConf:
    # ── security ────────────────────────────────────────────────────────────
    spark.authenticate: "true"
    spark.network.crypto.enabled: "true"
    spark.io.encryption.enabled: "true"
    spark.io.encryption.keySizeBits: "256"
    spark.ssl.ui.enabled: "true"
    spark.ssl.ui.keyStore: /stackable/tls/keystore.p12
    spark.ssl.ui.keyStorePassword: ""
    spark.ssl.ui.keyStoreType: PKCS12
    spark.ssl.ui.protocol: TLSv1.3

    # ── reading source files: Hadoop S3A ────────────────────────────────────
    spark.hadoop.fs.s3a.endpoint: https://minio.CHANGEME-NAMESPACE.svc.cluster.local:9000
    spark.hadoop.fs.s3a.endpoint.region: us-east-1
    spark.hadoop.fs.s3a.path.style.access: "true"

    # ── writing Iceberg tables: the catalog over the Hive metastore ─────────
    spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
    spark.sql.catalog.lakehouse: org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.lakehouse.type: hive
    spark.sql.catalog.lakehouse.uri: thrift://hive-iceberg-metastore:9083
    spark.sql.catalog.lakehouse.warehouse: s3://lakehouse/warehouse
    spark.sql.catalog.lakehouse.io-impl: org.apache.iceberg.aws.s3.S3FileIO
    spark.sql.catalog.lakehouse.s3.endpoint: https://minio.CHANGEME-NAMESPACE.svc.cluster.local:9000
    spark.sql.catalog.lakehouse.s3.path-style-access: "true"
    spark.sql.catalog.lakehouse.client.region: us-east-1

    # Credentials for both clients, from the Secret in manifests/02-s3.yaml.
    spark.kubernetes.driver.secretKeyRef.AWS_ACCESS_KEY_ID: lakehouse-rw-credentials:accessKey
    spark.kubernetes.driver.secretKeyRef.AWS_SECRET_ACCESS_KEY: lakehouse-rw-credentials:secretKey
    spark.kubernetes.executor.secretKeyRef.AWS_ACCESS_KEY_ID: lakehouse-rw-credentials:accessKey
    spark.kubernetes.executor.secretKeyRef.AWS_SECRET_ACCESS_KEY: lakehouse-rw-credentials:secretKey
  job:
    config:
      resources:
        cpu: {min: 300m, max: "1"}
        memory: {limit: 512Mi}
      volumeMounts:
        - name: jobs
          mountPath: /stackable/spark/jobs
  driver:
    config:
      resources:
        cpu: {min: 600m, max: "2"}
        memory: {limit: 1Gi}
      volumeMounts: &mounts
        - name: jobs
          mountPath: /stackable/spark/jobs
        - name: tls
          mountPath: /stackable/tls
  executor:
    replicas: 2
    config:
      resources:
        cpu: {min: 600m, max: "2"}
        memory: {limit: 1Gi}
      volumeMounts: *mounts
  volumes:
    - name: jobs
      configMap:
        name: spark-jobs
    # Certificate for the Spark web UI, issued by the platform's internal CA.
    - name: tls
      ephemeral:
        volumeClaimTemplate:
          metadata:
            annotations:
              secrets.stackable.tech/class: tls
              secrets.stackable.tech/scope: pod
              secrets.stackable.tech/format: tls-pkcs12
              # A week, matching the products. The load job finishes in minutes,
              # so this is only insurance: the restart-controller deletes a pod
              # at its certificate expiry, and for a driver pod that is the job
              # failing rather than a restart.
              secrets.stackable.tech/backend.autotls.cert.lifetime: 7d
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: "1"
            storageClassName: secrets.stackable.tech

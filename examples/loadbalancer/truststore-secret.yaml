####################################################################################
# The platform CA again, this time as a Secret.
#
# manifests/03-truststore.yaml publishes it as a ConfigMap, which is the right
# shape for the pods that mount it. ingress-nginx wants trust material as a
# Secret with a `ca.crt` key instead, so this asks the secret-operator for a
# second copy in that shape rather than copying the first one around.
#
# Apply it into the same namespace as the platform, alongside ingress.yaml.
#
# NOTE - a CA certificate is public by definition. Nothing here is secret; the
#   Secret kind is only what the ingress controller happens to read.
####################################################################################
---
apiVersion: secrets.stackable.tech/v1alpha1
kind: TrustStore
metadata:
  name: cluster-internal-ca-tls
spec:
  secretClassName: tls
  format: tls-pem
  targetKind: Secret
  tlsPemCaName: ca.crt

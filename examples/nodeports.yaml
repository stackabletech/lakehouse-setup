####################################################################################
# Direct external access without a load balancer: one NodePort Service per user
# interface.
#
# OPT-IN, applied by hand:
#
#   kubectl apply -n <namespace> -f examples/nodeports.yaml
#
# Here rather than in manifests/ because a NodePort is a decision about the
# cluster, not the platform. Most clusters have an ingress controller and want
# examples/loadbalancer/ instead - the two are alternatives, never both. On a
# cluster with neither, this is the quickest way in, and it is what the package
# is verified against locally.
#
# ── Ports ────────────────────────────────────────────────────────────────────────
#   31443  Keycloak     https   (from manifests/00-keycloak.yaml)
#   31080  Trino        https
#   31081  Airflow      http
#   31082  Superset     http
#
# Fixed numbers are the point. Two addresses have to be known before the pods
# start - Keycloak bakes its own into `KC_HOSTNAME`, Airflow into
# `AIRFLOW__CORE__BASE_URL`, from which its OIDC redirect is derived - so they
# cannot come from a dynamically assigned listener. Change a port here and change
# it in config.env too, or the agreement breaks at login. 31090 and 31091 are
# left free for the local object store console and git server.
#
# The products stay on the `cluster-internal` ListenerClass and these Services
# front them, rather than each using `external-unstable`, which would pick a new
# NodePort on every re-create.
#
# Keycloak's own NodePort is NOT here: it sits in manifests/00-keycloak.yaml next
# to the `KC_HOSTNAME` it has to agree with, so it exists whether this file is
# applied or not. Behind an ingress it is harmless and unused.
#
# NiFi is deliberately absent. Its Jetty refuses a request whose Host its
# certificate does not cover, and a Service-scoped certificate does not cover the
# node address, so it uses `external-unstable` and gets a dynamic NodePort - true
# regardless of this file, so NiFi is reachable either way. See 70-nifi.yaml.
#
# Nothing to fill in. `scripts/access.sh` prints the resulting URLs and accounts.
#
# IMPORTANT - do not apply this alongside examples/loadbalancer/. Behind an
#   ingress the products derive their public URLs from `X-Forwarded-Host`, and a
#   second route in on an address the certificates do not cover produces logins
#   that half-work: the browser authenticates and is then redirected to the
#   address the product thinks it has.
#
# NOTE - Trino's certificate is Service-scoped, so on the node address browsers
#   warn. Trino serves the request anyway, and in-cluster clients use the Service
#   name and verify normally.
####################################################################################
---
apiVersion: v1
kind: Service
metadata:
  name: trino-external
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: trino
    app.kubernetes.io/instance: trino
    app.kubernetes.io/component: coordinator
  ports:
    - {name: https, port: 8443, targetPort: 8443, nodePort: 31080}
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-external
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/instance: airflow
    app.kubernetes.io/component: webserver
  ports:
    - {name: http, port: 8080, targetPort: 8080, nodePort: 31081}
---
apiVersion: v1
kind: Service
metadata:
  name: superset-external
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: superset
    app.kubernetes.io/instance: superset
    app.kubernetes.io/component: node
  ports:
    - {name: http, port: 8088, targetPort: 8088, nodePort: 31082}

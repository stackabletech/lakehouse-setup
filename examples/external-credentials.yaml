####################################################################################
# The credentials for the infrastructure this package does NOT deploy: your
# PostgreSQL server and your git server.
#
# Four manifests reference these Secrets by name and define none of them, on
# purpose - the platform never owns a credential to something outside it:
#
#   keycloak-postgres-credentials   manifests/00-keycloak.yaml
#   hive-postgres-credentials       manifests/30-hive-metastore.yaml
#   airflow-postgres-credentials    manifests/51-airflow.yaml
#   superset-postgres-credentials   manifests/60-superset.yaml
#   airflow-git-credentials         manifests/51-airflow.yaml
#
# Apply this file before scripts/apply.sh. Without it the products are created
# and then sit in `ContainerCreating` or `CrashLoopBackOff` with a missing-secret
# message that names the Secret but not the file it should have come from.
#
#   kubectl apply -n <namespace> -f examples/external-credentials.yaml
#
# ── FILL IN ──────────────────────────────────────────────────────────────────────
#   CHANGEME-*-DB-USER       the PostgreSQL account for each database, and
#   CHANGEME-*-DB-PASSWORD   its password. Four separate accounts is the shape
#                            this package assumes; one shared account works too,
#                            in which case repeat the same pair four times.
#   CHANGEME-GIT-USER        the account or token name git-sync authenticates
#   CHANGEME-GIT-PASSWORD    the DAG repository with, and its secret. On GitHub
#                            and GitLab this pair is a username and a personal
#                            access or deploy token, not a login password.
#
# `scripts/check-config.sh` lists whichever of these is still unfilled, and
# `scripts/apply.sh` refuses to run while any of them is.
#
# IMPORTANT - the databases themselves are not created here. Each product
#   expects its database to exist already and to be empty on the first run; the
#   operators create the schema, they do not create the database. The four names
#   the manifests ask for are `keycloak`, `hive`, `airflow` and `superset`, set
#   next to the host in each consuming manifest.
#
# IMPORTANT - these Secrets are referenced by name only. Replacing them with
#   External Secrets, Sealed Secrets or a CSI driver needs no change anywhere
#   else, and is the right move for anything but a trial install.
#
# NOTE - the key names are what the operators expect and are not free choices.
#   PostgreSQL credentials use `username` and `password`; the git credential
#   uses `user` and `password`, which the Airflow operator hands to the git-sync
#   sidecar as GITSYNC_USERNAME and GITSYNC_PASSWORD. A Secret with the right
#   values under the wrong keys mounts without error and authenticates as
#   nobody.
####################################################################################
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-postgres-credentials
type: Opaque
stringData:
  username: CHANGEME-KEYCLOAK-DB-USER
  password: CHANGEME-KEYCLOAK-DB-PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: hive-postgres-credentials
type: Opaque
stringData:
  username: CHANGEME-HIVE-DB-USER
  password: CHANGEME-HIVE-DB-PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-postgres-credentials
type: Opaque
stringData:
  username: CHANGEME-AIRFLOW-DB-USER
  password: CHANGEME-AIRFLOW-DB-PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: superset-postgres-credentials
type: Opaque
stringData:
  username: CHANGEME-SUPERSET-DB-USER
  password: CHANGEME-SUPERSET-DB-PASSWORD
---
# The DAG repository. `user` and `password`, not `username` - see the NOTE above.
apiVersion: v1
kind: Secret
metadata:
  name: airflow-git-credentials
type: Opaque
stringData:
  user: CHANGEME-GIT-USER
  password: CHANGEME-GIT-PASSWORD
